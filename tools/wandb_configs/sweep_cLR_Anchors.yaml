program: train.py
project: VirConv
name: Sweep_cLR_Anchors
method: bayes

metric:
  name: train/loss
  goal: minimize

parameters:
  OPTIMIZATION.LR:
    distribution: log_uniform_values
    min: 0.0001
    max: 0.002

  ANCHOR_SIZE_X:
    min: 0.4
    max: 1.4
    initial: 0.9
  ANCHOR_SIZE_Y:
    min: 0.4
    max: 1.4
    initial: 1.3
  ANCHOR_SIZE_Z:
    min: 0.4
    max: 1.4
    initial: 0.5

run: 
  count: 20 

  
command:
  - python3
  - ${program}
  - --cfg_file
  - cfgs/models/kitti/VirConv-T-IW-DS-7.yaml
  - --epochs
  - 200
  - --batch_size
  - 1
  - --extra_tag
  - IW_DS7_000000_ckpt_200EP_
  - --ckpt
  - ../output/pretrained_models/VirConv-T-Paper.pth
  - --sweep_config
  - "${args_json_file}"
