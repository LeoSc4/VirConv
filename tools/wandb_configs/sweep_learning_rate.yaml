program: train.py 
project: VirConv
name: Constant_LR_cube
method: bayes  # Can also be 'grid' or 'random'
metric:
  name: train/loss        # metric that should be optimized
  goal: minimize


parameters:
  OPTIMIZATION.LR:
    distribution: log_uniform_values
    min: 0.0001
    max: 0.002

command:
  - python3
  - ${program}
  - --cfg_file
  - cfgs/models/kitti/VirConv-T-IW-DS-7.yaml
  - --epochs
  - 200
  - --batch_size
  - 1 
  - --extra_tag 
  - IW_DS7_000000_ckpt_200EP_Cube_
  - --ckpt
  - ../output/pretrained_models/VirConv-T-Paper.pth
  - --sweep_config
  - "${args_json_file}"