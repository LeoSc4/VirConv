DATA_PATH: '../data/kitti'

DATASET: 'KittiDataset'

MM_PATH: 'velodyne_depth'

# POINT_CLOUD_RANGE: [0, -40, -3, 70.4, 40, 1]
POINT_CLOUD_RANGE: [-6208, -1297, -256, 3608, 6997, 256]   
# POINT_CLOUD_RANGE: [-2000, -4000, -8, 0, 2000, 200]       #makes sense according to the histograms
# POINT_CLOUD_RANGE: [0, -4000, -8, 2000, 2000, 200]      # adapted x to be -x as the points array in data_processor indicated to be within another range 


      # VOXEL_SIZE: [4.8, 4.8, 12.8]     #[0.05, 0.05, 0.1]


### https://github.com/open-mmlab/OpenPCDet/issues/1706
#For voxel based detectors such as SECOND, PV-RCNN and CenterPoint.
# Law: point cloud range along x,y -axis / voxel_size is the multiple of 16.
# range_x = x_max - x_min ; range_x / voxel_size mod 16 = 0
# Notice that the second rule also suit pillar based detectors such as PointPillar and CenterPoint-Pillar.
# Example:
# x = [0, 70.4] ; y = [-40, 40]
# x-axis: 70.4 - 0 = 70.4 / 0.1 = 704 mod 16 = 0
# y-axis: 40 - (-40) = 80 / 0.1 = 800 mod 16 = 0


DATA_SPLIT: {
    'train': train,
    'test': val
}

INFO_PATH: {
    'train': [kitti_infos_train.pkl],
    'test': [kitti_infos_val.pkl],
}

FOV_POINTS_ONLY: True 


DATA_AUGMENTOR:
    DISABLE_AUG_LIST: ['gt_sampling', 'da_sampling', 'random_local_noise', 'random_world_rotation', 'random_world_flip', 'random_world_scaling', 'random_local_trans', 'random_local_pyramid_aug' ]        #deactivated Data Augmentation for the object as we will do it in the simulation // https://github.com/open-mmlab/OpenPCDet/issues/151

    AUG_CONFIG_LIST:
        - NAME: gt_sampling
          USE_ROAD_PLANE: True
          DB_INFO_PATH:
              - kitti_dbinfos_train.pkl
          PREPARE: {
             filter_by_min_points: ['Car:0'],        # ['Car:5', 'Pedestrian:5', 'Cyclist:5']     -> deleted Pedestrian and Cyclists as I do not want to do Data Augmentation on them because my scene has only Dollies -> denoted as 'Cars'
            filter_by_difficulty: [-1],                                          # [-1] was default -> the -1 difficulty will be removed in filter_by_difficulty database_sampler.py
          }

          SAMPLE_GROUPS: ['Car:1','Pedestrian:2', 'Cyclist:3']        #['Car:15','Pedestrian:10', 'Cyclist:10']
          NUM_POINT_FEATURES: 4
          DATABASE_WITH_FAKELIDAR: False
          REMOVE_EXTRA_WIDTH: [0.0, 0.0, 0.0]
          LIMIT_WHOLE_SCENE: False

        - NAME: random_world_flip
          ALONG_AXIS_LIST: ['x']

        - NAME: random_world_rotation
          WORLD_ROT_ANGLE: [-0.78539816, 0.78539816]

        - NAME: random_world_scaling
          WORLD_SCALE_RANGE: [0.95, 1.05]



POINT_FEATURE_ENCODING: {
    encoding_type: absolute_coordinates_encoding,
    used_feature_list: ['x', 'y', 'z', 'intensity'],
    src_feature_list: ['x', 'y', 'z', 'intensity'],
}


DATA_PROCESSOR:
    - NAME: mask_points_and_boxes_outside_range
      REMOVE_OUTSIDE_BOXES: True

    - NAME: shuffle_points
      SHUFFLE_ENABLED: {
        'train': True,
        'test': False
      }

    - NAME: transform_points_to_voxels
      # VOXEL_SIZE: [1.6, 1.6, 3.2]     #[0.05, 0.05, 0.1]
      VOXEL_SIZE: [4.8, 4.8, 12.8]     #[0.05, 0.05, 0.1]

         # https://github.com/open-mmlab/OpenPCDet/issues/253#issuecomment-679190936
        # point cloud range along z-axis / voxel_size is 40
        # point cloud range along x,y -axis / voxel_size is the multiple of 16.


      MAX_POINTS_PER_VOXEL:  400         #5
      MAX_NUMBER_OF_VOXELS: {
        'train': 16000, #1600000,
        'test': 4000        #4000000,
      }
